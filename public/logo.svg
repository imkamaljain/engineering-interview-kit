<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <defs>
        <!-- Blue Gradient for { -->
        <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#2563eb" />
        </linearGradient>
        <!-- Purple Gradient for } -->
        <linearGradient id="gradPurple" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#e879f9" />
            <stop offset="100%" stop-color="#7c3aed" />
        </linearGradient>
        <!-- Yellow/Amber Gradient for Lightning -->
        <linearGradient id="gradBolt" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#f59e0b" />
            <stop offset="100%" stop-color="#fde047" />
        </linearGradient>
        
        <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="5" />
            <feOffset dx="0" dy="4" result="offsetblur" />
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.4" />
            </feComponentTransfer>
            <feMerge> 
                <feMergeNode />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>
    
    <g filter="url(#dropGlow)" stroke-linecap="round" stroke-linejoin="round">
        
        <!-- Left Bracket < -->
        <path d="M 70 40 L 30 100 L 70 160" 
              stroke="url(#gradBlue)" stroke-width="22" fill="none" />
        
        <!-- Right Bracket > -->
        <path d="M 130 40 L 170 100 L 130 160" 
              stroke="url(#gradPurple)" stroke-width="22" fill="none" />
        
        <!-- Lightning Bolt (Fast Revision/Execution) -->
        <path d="M 125 40 L 70 115 L 110 115 L 80 170 L 135 95 L 95 95 Z" 
              fill="url(#gradBolt)" stroke="url(#gradBolt)" stroke-width="12" />
    </g>
</svg>
